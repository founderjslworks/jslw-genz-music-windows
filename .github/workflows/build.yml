name: Build GEN-Z Music for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build GenZ.Desktop/GenZ.Desktop.csproj -c Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test (start the app and read any crash)
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = "$env:APPDATA\GEN-Z Music"
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{"TermsAccepted":true}' | Out-File -Encoding utf8 "$dir\settings.json"
          $exe = (Resolve-Path "GenZ.Desktop/bin/Release/net48/GEN-Z Music.exe").Path
          $start = Get-Date
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep 20
          "alive=" + (-not $p.HasExited) + " exit=" + $(if ($p.HasExited) { $p.ExitCode } else { "-" }) | Out-File smoke.log
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime','Application Error','Windows Error Reporting' } |
            ForEach-Object { "---- " + $_.ProviderName; $_.Message } | Out-File -Append -Width 500 smoke.log
          Get-Content "$dir\crash.log" -ErrorAction SilentlyContinue | Out-File -Append smoke.log
          Get-Content smoke.log

      - name: Package portable zip
        shell: pwsh
        run: |
          $out = "GenZ.Desktop/bin/Release/net48"
          Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
          $v = (Select-String -Path GenZ.Desktop/GenZ.Desktop.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          Compress-Archive -Path "$out/*" -DestinationPath "GEN-Z-Music-Windows-$v.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $v = (Select-String -Path GenZ.Desktop/GenZ.Desktop.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/genz.iss 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GEN-Z-Music-Windows
          path: |
            GEN-Z-Music-Windows-*.zip
            dist/*.exe

      # Tag a version (git tag v1.5.4 && git push --tags) and the installer and zip are published as a GitHub release.
      - name: Publish release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.exe GEN-Z-Music-Windows-*.zip \
            --title "GEN-Z Music for Windows ${GITHUB_REF_NAME#v}" --notes "Installer (recommended) and portable zip. Windows 7 SP1 to 11 · .NET Framework 4.8." || \
          gh release upload "${GITHUB_REF_NAME}" dist/*.exe GEN-Z-Music-Windows-*.zip --clobber
